<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>App 1</title>
    <style>
        .hello {
            font-size: 3em;
            margin-top: 40px;
            text-align: center;
        }
        .logout-btn {
            display: block;
            margin: 40px auto;
            padding: 12px 32px;
            font-size: 1.2em;
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .logout-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="hello">Hello App 1 : <b>{{user.username}}</b></div>
    <a href="{% url 'logout' %}">Déconnexion</a>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="logout-btn">Déconnexion</button>
    </form>
</body>
</html>
